name = "web"
version = "0.1.0"
description = "Kito in a browser: the board, a lane's diff, its comments and its review"
api = 1
# It reads the repository, and writes comments and verdicts for whoever
# opened it. It does not integrate: that stays `kito integrate`.
permissions = ["read", "write"]

[[command]]
name = "web"
about = "Serve the web client for this repository on this machine"
