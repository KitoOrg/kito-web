[package]
name = "kito-web"
description = "Kito in a browser: a plugin that serves a web client for a repository"
version = "0.7.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kito-web"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
debug = false
strip = true
